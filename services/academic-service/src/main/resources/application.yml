server:
  port: ${ACADEMIC_SERVICE_PORT:8082}

spring:
  application:
    name: academic-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/academic_db
    username: ${POSTGRES_USER:unihub}
    password: ${POSTGRES_PASSWORD:unihub_local_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 4000

resilience4j:
  circuitbreaker:
    instances:
      identity-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
  retry:
    instances:
      identity-service:
        maxAttempts: 2
        waitDuration: 300ms

app:
  services:
    identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  seed:
    enabled: ${SEED_ACADEMIC_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
