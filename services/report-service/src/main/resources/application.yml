server:
  port: ${REPORT_SERVICE_PORT:8086}

spring:
  application:
    name: report-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/report_db
    username: ${POSTGRES_USER:unihub}
    password: ${POSTGRES_PASSWORD:unihub_local_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
