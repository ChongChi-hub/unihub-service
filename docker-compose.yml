services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: unihub-postgres
    profiles: ["infra", "core", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unihub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unihub_local_pass}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - unihub_postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unihub} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - unihub-network

  redis:
    image: redis:7-alpine
    container_name: unihub-redis
    profiles: ["infra", "core", "full"]
    command: redis-server --requirepass ${REDIS_PASSWORD:-unihub_redis_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - unihub_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-unihub_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - unihub-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: unihub-rabbitmq
    profiles: ["infra", "core", "full"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-unihub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-unihub_rabbit_pass}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - unihub_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - unihub-network

  minio:
    image: pgsty/silo:latest
    container_name: unihub-minio
    profiles: ["infra", "core", "full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-unihub_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-unihub_minio_pass}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - unihub_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - unihub-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: unihub-mailhog
    profiles: ["infra", "core", "full"]
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - unihub-network

volumes:
  unihub_postgres_data:
  unihub_redis_data:
  unihub_rabbitmq_data:
  unihub_minio_data:

networks:
  unihub-network:
    name: unihub-network
    driver: bridge
