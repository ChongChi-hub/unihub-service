name: CI - Unihub Service

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gradle-check:
    name: Gradle Format, Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run Spotless and Gradle check
        run: ./gradlew spotlessCheck check --no-daemon

  docker-build:
    name: Docker Build Check (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: gradle-check
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, identity-service, academic-service, learning-service, file-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: unihub-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
